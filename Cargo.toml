[package]
name = "harbor-sql"
version = "0.40.0"
edition = "2024"
default-run = "harbor-sql"
description = "A native MySQL and MariaDB workspace"

[dependencies]
base64 = "0.22"
calamine = { version = "=0.38.0", features = ["chrono"] }
cfb = "=0.15.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
codepage = "0.1.3"
ctrlc = "3.5"
csv = "1.4"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.33"
encoding_rs = "=0.8.44"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png"] }
jetdb = "=0.4.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
libloading = "0.8.9"
mysql = { version = "=28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "=1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls"] }
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
rfd = "0.17"
same-file = "=1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlformat = "0.5"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
ttf-parser = "=0.25.1"
unicode-width = "=0.2.3"
zip = { version = "=9.7.2", default-features = false }
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSObject", "NSString"] }

[patch.crates-io]
mysql = { path = "vendor/mysql-28.0.4" }

[profile.release]
strip = true
lto = "thin"

# MSVC D8050 when emitting native debug records under Unicode project paths.
[profile.dev.package.ring]
debug = false
